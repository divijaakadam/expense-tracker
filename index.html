<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Expense Tracker</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f7fb;
        color: #1f2937;
    }
    .container {
        width: min(1100px, 92%);
        margin: 35px auto;
    }
    header {
        background: #ffffff;
        padding: 28px;
        border-radius: 14px;
        box-shadow: 0 4px 18px rgba(0,0,0,.08);
        margin-bottom: 22px;
    }
    h1 { margin: 0 0 8px; }
    .subtitle { color: #6b7280; margin: 0; }
    .grid {
        display: grid;
        grid-template-columns: 1fr 1.5fr;
        gap: 22px;
    }
    .card {
        background: #fff;
        padding: 22px;
        border-radius: 14px;
        box-shadow: 0 4px 18px rgba(0,0,0,.07);
    }
    h2 { margin-top: 0; }
    label {
        display: block;
        margin: 13px 0 6px;
        font-weight: 600;
    }
    input, select, button {
        width: 100%;
        padding: 11px 12px;
        border-radius: 8px;
        border: 1px solid #d1d5db;
        font-size: 15px;
    }
    button {
        margin-top: 16px;
        border: 0;
        background: #2563eb;
        color: white;
        font-weight: 700;
        cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    .summary {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 18px;
    }
    .summary-box {
        background: #f8fafc;
        padding: 15px;
        border-radius: 10px;
        text-align: center;
    }
    .summary-box strong {
        display: block;
        font-size: 21px;
        margin-top: 5px;
    }
    .controls {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
    }
    .controls input, .controls select { width: 50%; }
    table {
        width: 100%;
        border-collapse: collapse;
    }
    th, td {
        text-align: left;
        padding: 12px 8px;
        border-bottom: 1px solid #e5e7eb;
    }
    th { font-size: 14px; color: #6b7280; }
    .delete {
        width: auto;
        margin: 0;
        padding: 7px 10px;
        background: #dc2626;
    }
    .delete:hover { background: #b91c1c; }
    .empty {
        text-align: center;
        color: #6b7280;
        padding: 25px;
    }
    @media (max-width: 800px) {
        .grid { grid-template-columns: 1fr; }
        .summary { grid-template-columns: 1fr; }
        .controls { flex-direction: column; }
        .controls input, .controls select { width: 100%; }
        table { font-size: 13px; }
    }
</style>
</head>
<body>
<div class="container">
    <header>
        <h1>Personal Expense Tracker</h1>
        <p class="subtitle">Add, view, filter and manage your daily expenses.</p>
    </header>

    <div class="grid">
        <section class="card">
            <h2>Add Expense</h2>
            <form id="expenseForm">
                <label for="title">Expense Name</label>
                <input id="title" type="text" placeholder="e.g. Lunch" required>

                <label for="amount">Amount (₹)</label>
                <input id="amount" type="number" min="0.01" step="0.01" placeholder="e.g. 250" required>

                <label for="category">Category</label>
                <select id="category" required>
                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Bills">Bills</option>
                    <option value="Education">Education</option>
                    <option value="Other">Other</option>
                </select>

                <label for="date">Date</label>
                <input id="date" type="date" required>

                <button type="submit">Add Expense</button>
            </form>
        </section>

        <section class="card">
            <h2>Dashboard</h2>
            <div class="summary">
                <div class="summary-box">Total Expense<strong id="total">₹0.00</strong></div>
                <div class="summary-box">Number of Expenses<strong id="count">0</strong></div>
                <div class="summary-box">Average Expense<strong id="average">₹0.00</strong></div>
            </div>

            <div class="controls">
                <input id="search" type="text" placeholder="Search expenses...">
                <select id="filter">
                    <option value="All">All Categories</option>
                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Bills">Bills</option>
                    <option value="Education">Education</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Expense</th>
                        <th>Amount</th>
                        <th>Category</th>
                        <th>Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="expenseList"></tbody>
            </table>
            <div id="empty" class="empty">No expenses added yet.</div>
        </section>
    </div>
</div>

<script>
const form = document.getElementById("expenseForm");
const title = document.getElementById("title");
const amount = document.getElementById("amount");
const category = document.getElementById("category");
const date = document.getElementById("date");
const list = document.getElementById("expenseList");
const empty = document.getElementById("empty");
const total = document.getElementById("total");
const count = document.getElementById("count");
const average = document.getElementById("average");
const search = document.getElementById("search");
const filter = document.getElementById("filter");

date.value = new Date().toISOString().split("T")[0];

let expenses = JSON.parse(localStorage.getItem("expenses")) || [];

function save() {
    localStorage.setItem("expenses", JSON.stringify(expenses));
}

function render() {
    const query = search.value.toLowerCase().trim();
    const selected = filter.value;

    const visible = expenses.filter(e =>
        (e.title.toLowerCase().includes(query) ||
         e.category.toLowerCase().includes(query)) &&
        (selected === "All" || e.category === selected)
    );

    list.innerHTML = "";

    visible.forEach(e => {
        const row = document.createElement("tr");
        row.innerHTML = `
            <td>${escapeHtml(e.title)}</td>
            <td>₹${Number(e.amount).toFixed(2)}</td>
            <td>${escapeHtml(e.category)}</td>
            <td>${e.date}</td>
            <td><button class="delete" onclick="removeExpense('${e.id}')">Delete</button></td>
        `;
        list.appendChild(row);
    });

    empty.style.display = visible.length ? "none" : "block";

    const totalAmount = expenses.reduce((sum, e) => sum + Number(e.amount), 0);
    total.textContent = `₹${totalAmount.toFixed(2)}`;
    count.textContent = expenses.length;
    average.textContent = `₹${(expenses.length ? totalAmount / expenses.length : 0).toFixed(2)}`;
}

function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}

form.addEventListener("submit", function(event) {
    event.preventDefault();

    expenses.unshift({
        id: Date.now().toString(),
        title: title.value.trim(),
        amount: Number(amount.value),
        category: category.value,
        date: date.value
    });

    save();
    form.reset();
    date.value = new Date().toISOString().split("T")[0];
    render();
});

function removeExpense(id) {
    expenses = expenses.filter(e => e.id !== id);
    save();
    render();
}

search.addEventListener("input", render);
filter.addEventListener("change", render);

render();
</script>
</body>
</html>
